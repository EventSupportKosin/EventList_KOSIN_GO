  /* ป้าย "เสร็จสมบูรณ์แล้ว" — แสงวิ้งไล่พาดผ่านวนซ้ำ */
  .pill-shine {
    position: relative;
    overflow: hidden;
    isolation: isolate;
  }
  .pill-shine::after {
    content: "";
    position: absolute;
    top: 0;
    left: -60%;
    width: 45%;
    height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.85), transparent);
    animation: pill-shine-sweep 2.2s ease-in-out infinite;
  }
  @keyframes pill-shine-sweep {
    0% { left: -60%; }
    100% { left: 130%; }
  }

  /* ป้าย "ถึงวันงานแล้ว" — กระพริบไซเรนส้ม/แดง พร้อมเรืองแสงเต้น */
  .pill-siren {
    animation: pill-siren-flash 1s ease-in-out infinite;
  }
  @keyframes pill-siren-flash {
    0%, 100% {
      background-color: #f97316;
      box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.6);
    }
    50% {
      background-color: #ef4444;
      box-shadow: 0 0 0 6px rgba(239, 68, 68, 0);
    }
  }

// URL ของ Google Apps Script Web App (สำหรับใช้งานผ่าน GitHub Pages)
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwkZDdwk9R1pZLX5PHlHeQdiPNID-eZ3WjU4iP5481PFeIeRGpixN3E6QRJhJlC04xOlQ/exec";

async function gsRun(fnName, ...args) {
  // ถ้าเปิดจากลิงก์ Apps Script โดยตรง ใช้ google.script.run ตามเดิม
  if (typeof google !== "undefined" && google.script && google.script.run) {
    return new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(res => {
        resolve(res);
      }).withFailureHandler(err => {
        reject(new Error(err && err.message || String(err)));
      })[fnName](...args);
    });
  }

  // ถ้าเปิดจาก GitHub Pages ใช้ fetch ไปที่ Apps Script Web App
  let res;
  if (fnName === "apiList") {
    res = await fetch(`${WEB_APP_URL}?action=list&_=${Date.now()}`, {
      method: "GET",
      redirect: "follow"
    });
  } else if (fnName === "apiLogList") {
    const limit = args[0] || 300;
    res = await fetch(`${WEB_APP_URL}?action=logList&limit=${encodeURIComponent(limit)}&_=${Date.now()}`, {
      method: "GET",
      redirect: "follow"
    });
  } else if (fnName === "apiPost") {
    res = await fetch(WEB_APP_URL, {
      method: "POST",
      redirect: "follow",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(args[0] || {})
    });
  } else {
    throw new Error("ไม่รู้จักฟังก์ชัน: " + fnName);
  }

  if (!res.ok) {
    throw new Error("HTTP " + res.status);
  }
  const json = await res.json();
  if (!json || json.ok === false) {
    throw new Error((json && json.error) || "เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ");
  }
  return json.data;
}
async function apiList() {
  return gsRun("apiList");
}
async function apiPost(payload) {
  return gsRun("apiPost", {

    actor: currentActor
  });
}
async function apiLogList(limit) {
  return gsRun("apiLogList", limit);
